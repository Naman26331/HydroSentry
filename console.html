<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HydroSentry</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
  integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<style>
:root{--g:#1a73e8;--ok:#188038;--bad:#d93025;--ink:#202124;--sub:#5f6368;--card:#fff;--line:#dadce0}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink)}
#map{position:fixed;inset:0;background:#e8eaed}
.float{position:fixed;z-index:1000;background:var(--card);box-shadow:0 2px 8px rgba(60,64,67,.35)}
#top{position:fixed;z-index:1000;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;flex-direction:column;gap:8px;pointer-events:none}
#top>*{pointer-events:auto}
.row{display:flex;gap:8px;align-items:center}
#pill{flex:1;min-width:0;background:var(--card);border-radius:28px;padding:10px 16px;box-shadow:0 2px 8px rgba(60,64,67,.35);
  display:flex;align-items:center;gap:10px;font-size:15px;font-weight:500;white-space:nowrap}
#pill .dot{width:10px;height:10px;border-radius:50%;background:var(--g);flex:none}
#pill span.t{overflow:hidden;text-overflow:ellipsis}
#officerBtn{flex:none;border:0;border-radius:22px;padding:11px 14px;background:var(--card);color:var(--g);font:500 13px Roboto,"Segoe UI",system-ui,sans-serif;
  box-shadow:0 2px 8px rgba(60,64,67,.35);cursor:pointer}
#officerBtn[aria-pressed=true]{background:var(--g);color:#fff}
#sims{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
#sims button{flex:none;border:1px solid var(--line);border-radius:18px;padding:8px 14px;background:var(--card);
  font:500 13px Roboto,"Segoe UI",system-ui,sans-serif;color:var(--ink);cursor:pointer;box-shadow:0 1px 3px rgba(60,64,67,.3)}
#sims button[aria-pressed=true]{background:#e8f0fe;border-color:var(--g);color:var(--g)}
button:focus-visible{outline:2px solid var(--g);outline-offset:2px}
#drawer{left:0;right:0;bottom:0;border-radius:16px 16px 0 0;padding:14px 18px calc(16px + env(safe-area-inset-bottom));
  transition:transform .3s}
#drawer .handle{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
#status{font-size:20px;font-weight:600;line-height:1.3}
#status.ok{color:var(--ok)} #status.warn{color:#b06000} #status.bad{color:var(--bad)}
#sub{margin-top:4px;font-size:14px;color:var(--sub)}
#note{margin-top:8px;font-size:11px;color:var(--sub)}
#officer{left:0;right:0;bottom:0;max-height:62vh;overflow:auto;border-radius:16px 16px 0 0;padding:14px 16px 24px;
  transform:translateY(105%);transition:transform .3s;z-index:1100}
#officer.open{transform:none}
#officer h2{margin:0 0 10px;font-size:16px}
.card{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.card b{display:block;font-size:15px}
.card .meta{font-size:13px;color:var(--sub);margin-top:4px}
.chip{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:12px;font-size:12px;font-weight:600}
.chip.go{background:#fce8e6;color:var(--bad)} .chip.stby{background:#fef7e0;color:#b06000} .chip.none{background:#e6f4ea;color:var(--ok)}
.hazard-icon{background:var(--bad);color:#fff;border-radius:50%;width:30px;height:30px;display:flex;align-items:center;
  justify-content:center;font-size:16px;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.4)}
.lbl{background:#fff;border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:11px;font-weight:600;box-shadow:none}
@media(prefers-reduced-motion:reduce){#drawer,#officer{transition:none}}
.leaflet-control-zoom{display:none}
</style>
</head>
<body>
<div id="map" role="application" aria-label="Map of New Delhi"></div>

<div id="top">
  <div class="row">
    <div id="pill"><span class="dot"></span><span class="t">Connaught Place ➔ Lajpat Nagar</span></div>
    <button id="officerBtn" aria-pressed="false" aria-controls="officer">Officer View</button>
  </div>
  <div id="sims" role="group" aria-label="Simulation">
    <button data-s="dry" aria-pressed="true">Dry</button>
    <button data-s="moderate" aria-pressed="false">Moderate Rain</button>
    <button data-s="cloudburst" aria-pressed="false">Cloudburst (65 mm/hr)</button>
  </div>
</div>

<div id="drawer" class="float" aria-live="polite">
  <div class="handle"></div>
  <div id="status" class="ok">Route Normal • 22 mins</div>
  <div id="sub"></div>
  <div id="note"></div>
</div>

<div id="officer" class="float" role="region" aria-label="Pump dispatch cards">
  <h2>Pump dispatch</h2>
  <div id="cards"></div>
</div>

<script>
"use strict";
// ── Configuration ─────────────────────────────────────────────────────────────
// Backend base URL. Local: `sam local start-api` (default). Cloud: paste your
// API Gateway URL (same value as API_GATEWAY_URL in .env), no trailing slash.
const API_BASE_URL = "http://127.0.0.1:3000";
const API_TIMEOUT_MS = 4000;

// ── Seed data (data/delhi_sinks.yaml) ─────────────────────────────────────────
const SINKS = [
  {id:"DELSNK001", name:"Minto Underpass",        short:"Minto",   ll:[28.63361,77.21722], area:48500, c:0.92, vol:1850, drain:120},
  {id:"DELSNK002", name:"Pul Prahladpur Underpass",short:"Prahladpur", ll:[28.49770,77.29470], area:62000, c:0.90, vol:2400, drain:95},
  {id:"DELSNK003", name:"Zakhira Underpass",      short:"Zakhira", ll:[28.65900,77.16800], area:41200, c:0.88, vol:1620, drain:80},
];
const SCENARIOS = {dry:0, moderate:15, cloudburst:65};

// Illustrative routes (hand-drawn waypoints, NOT turn-by-turn navigation).
const CP = [28.6315,77.2167], LN = [28.5677,77.2433];
const MAIN   = [CP, [28.6336,77.2172], [28.6280,77.2290], [28.6139,77.2410], [28.5900,77.2420], LN];
const BYPASS = [CP, [28.6270,77.2150], [28.6190,77.2270], [28.6139,77.2410], [28.5900,77.2420], LN];

// ── Local fallback compute (port of compute.py, Phase 1) ─────────────────────
const h2 = v => Math.floor(v*100+0.5)/100;
function localCompute(s, rain){
  const net = rain/1000*s.area*s.c - s.drain;
  if (net <= 0) return {status:"CLEAR", depth_mm:0, tts_min:null, required_pump_hp:0, cedar_authorization:"DISPATCH_DENIED"};
  const tts = s.vol/net*60, volm = Math.min(s.vol, net*15/60);
  const depth = Math.floor(volm/s.vol*35.0*10+1e-9), ttsI = Math.floor(tts+1e-9);
  return {status:"HAZARD_ACTIVE", depth_mm:depth, tts_min:ttsI, required_pump_hp:h2(net*5/270),
          cedar_authorization:(depth>=350 && ttsI<=30) ? "DISPATCH_AUTHORIZED":"DISPATCH_DENIED"};
}
{ const r = localCompute(SINKS[0],65);   // Phase 1 golden
  console.assert(r.depth_mm===131 && r.tts_min===39 && r.required_pump_hp===51.49, "golden mismatch"); }

async function fetchSink(s, rain){
  const ctl = new AbortController(), t = setTimeout(()=>ctl.abort(), API_TIMEOUT_MS);
  try{
    const res = await fetch(API_BASE_URL + "/telemetry/rainfall", {method:"POST", signal:ctl.signal,
      headers:{"Content-Type":"application/json"}, body:JSON.stringify({sink_id:s.id, rainfall_mm_hr:rain})});
    if(!res.ok) throw new Error("HTTP "+res.status);
    return await res.json();
  } finally { clearTimeout(t); }
}

// ── Map ───────────────────────────────────────────────────────────────────────
const map = L.map("map",{zoomControl:false,attributionControl:true}).setView([28.60,77.23],12);
// Keyless open tiles: OpenStreetMap (primary). CARTO Positron is the fallback if OSM tiles fail.
const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png",
  {maxZoom:19, attribution:"© OpenStreetMap contributors"}).addTo(map);
let fellBack = false;
osm.on("tileerror", ()=>{ if(fellBack) return; fellBack = true; map.removeLayer(osm);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
    {maxZoom:19, subdomains:"abcd", attribution:"© OpenStreetMap contributors © CARTO"}).addTo(map); });
map.fitBounds(L.latLngBounds([CP,LN]).pad(0.35));

const layer = L.layerGroup().addTo(map);
const pin = (ll,color)=>L.circleMarker(ll,{radius:7,color:"#fff",weight:3,fillColor:color,fillOpacity:1});

// ── Render ────────────────────────────────────────────────────────────────────
const $ = id => document.getElementById(id);
function classify(r){            // layman level for one sink
  if(r.status!=="HAZARD_ACTIVE") return "clear";
  if(r.cedar_authorization==="DISPATCH_AUTHORIZED" || r.depth_mm>=350 || (r.tts_min!==null && r.tts_min<=45)) return "danger";
  return "watch";
}
function render(results, mode){
  layer.clearLayers();
  const lv = results.map(classify);
  const minto = lv[0];
  const reroute = minto==="danger";

  // Main route (greyed when rerouting) + origin/destination pins
  L.polyline(MAIN,{color:reroute?"#9aa0a6":"#1a73e8",weight:reroute?5:7,opacity:reroute?.7:1,dashArray:reroute?"2 10":null,lineCap:"round"}).addTo(layer);
  if(reroute) L.polyline(BYPASS,{color:"#188038",weight:7,lineCap:"round"}).addTo(layer);
  pin(CP,"#1a73e8").addTo(layer).bindTooltip("Connaught Place",{permanent:true,direction:"left",className:"lbl"});
  pin(LN,"#d93025").addTo(layer).bindTooltip("Lajpat Nagar",{permanent:true,direction:"bottom",className:"lbl"});

  // Flooded sinks: red zone + hazard icon
  SINKS.forEach((s,i)=>{
    if(lv[i]!=="danger") return;
    L.circle(s.ll,{radius:260,color:"#d93025",weight:2,fillColor:"#d93025",fillOpacity:.35}).addTo(layer);
    L.marker(s.ll,{icon:L.divIcon({className:"",html:'<div class="hazard-icon">⚠</div>',iconSize:[30,30],iconAnchor:[15,15]})})
      .addTo(layer).bindTooltip(s.name,{direction:"right",className:"lbl"});
  });

  // Drawer
  const st=$("status"), sub=$("sub");
  if(reroute){
    st.className="bad"; st.textContent="⚠️ Rerouted around Minto Underpass • +4 mins • 100% Dry Road";
    sub.textContent="Flooding expected on the usual route. New trip: 26 mins.";
  } else {
    st.className = minto==="watch" ? "warn" : "ok"; st.textContent="Route Normal • 22 mins";
    sub.textContent = minto==="watch" ? "Light rain — we're keeping an eye on Minto Underpass." : "No flooding on your route.";
  }
  $("note").textContent = (mode==="api" ? "Live data from "+API_BASE_URL : "Offline demo (backend not reachable at "+API_BASE_URL+")")
    + " • Illustrative route, not navigation";

  // Officer cards (textContent only)
  const box=$("cards"); box.textContent="";
  SINKS.forEach((s,i)=>{
    const r=results[i], c=document.createElement("div"); c.className="card";
    const b=document.createElement("b"); b.textContent=s.name;
    const m=document.createElement("div"); m.className="meta";
    const chip=document.createElement("span"); chip.className="chip";
    if(r.status!=="HAZARD_ACTIVE"){ m.textContent="Water is draining normally."; chip.classList.add("none"); chip.textContent="No pump needed"; }
    else {
      m.textContent="Water "+r.depth_mm+" mm of 350 mm danger level • about "+r.tts_min+" min to danger • pump power ~"+Math.round(r.required_pump_hp)+" HP";
      if(r.cedar_authorization==="DISPATCH_AUTHORIZED"){ chip.classList.add("go"); chip.textContent="Dispatch pump now"; }
      else { chip.classList.add("stby"); chip.textContent="Standby — not yet at dispatch level"; }
    }
    c.append(b,m,chip); box.append(c);
  });
}

async function run(name){
  document.querySelectorAll("#sims button").forEach(b=>b.setAttribute("aria-pressed", b.dataset.s===name));
  const rain=SCENARIOS[name];
  let results, mode="api";
  try { results = await Promise.all(SINKS.map(s=>fetchSink(s,rain))); }
  catch(e){ mode="local"; results = SINKS.map(s=>localCompute(s,rain)); }
  render(results, mode);
}
document.querySelectorAll("#sims button").forEach(b=>b.addEventListener("click",()=>run(b.dataset.s)));
$("officerBtn").addEventListener("click",()=>{
  const open=$("officer").classList.toggle("open");
  $("officerBtn").setAttribute("aria-pressed",open);
  $("officerBtn").textContent = open ? "Close" : "Officer View";
});
window.addEventListener("error",e=>console.error("[HydroSentry]",e.message));
run("dry");
</script>
</body>
</html>
